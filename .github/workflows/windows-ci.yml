# Windows CI on a GitHub-hosted runner (windows-latest).
#
# Manual only. GitHub-hosted runners have NO hardware GPU: every D3D12 test
# here runs on WARP (Microsoft's software rasterizer), so passing tests prove
# translation/correctness on WARP, not behaviour or performance on the
# RTX 3070. VICTORY_D3D12_DEBUG is not set, so D3D12 debug-layer validation
# does not run here (the image does ship d3d12SDKLayers.dll; the job records
# it). No title is ever launched. Hardware runs go through
# home-rtx3070-diagnostic.yml.
name: Windows CI

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Tests to run (shader-gpu = victory-shader + victory-gpu on WARP; workspace = all crates; none)"
        type: choice
        options: [shader-gpu, workspace, none]
        default: shader-gpu
      build_diag:
        description: "Build target/diag/victory.exe (cargo build --profile diag -p victory --features diagnostics)"
        type: boolean
        default: true
      upload_diag_exe:
        description: "Also upload the built diagnostic executable (3-day retention; our code only)"
        type: boolean
        default: false
      fmt_base:
        description: "Formatting-gate base: a branch (merge-base with origin/<branch>) or a commit SHA (e.g. the default branch's previous tip after a rebase-merge or multi-commit push). If HEAD is already in it, HEAD's first parent is used"
        type: string
        default: hust/phase12-memory

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Keep test parallelism modest on the 4-vCPU hosted image.
  RUST_TEST_THREADS: "2"
  # LOG_DIR is set by the first step to $RUNNER_TEMP\ci-logs: outside the
  # checkout, where untracked logs would fail xtask's repository_passes_policy.

jobs:
  windows:
    name: Windows (windows-latest, WARP only)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          $env:LOG_DIR = Join-Path $env:RUNNER_TEMP 'ci-logs'
          "LOG_DIR=$env:LOG_DIR" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          rustup --version
          # Installs exactly the channel, components and target named in rust-toolchain.toml.
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose | Tee-Object -FilePath "$env:LOG_DIR\toolchain.txt"
          cargo --version | Tee-Object -FilePath "$env:LOG_DIR\toolchain.txt" -Append

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-ci
          cache-on-failure: false

      - name: Record the host environment (GPU limitations)
        run: |
          $gpus = @(Get-CimInstance Win32_VideoController | ForEach-Object { "$($_.Name) [status=$($_.Status)]" })
          $debugLayer = Test-Path "$env:SystemRoot\System32\d3d12SDKLayers.dll"
          $lines = @(
            "runner image: $env:ImageOS $env:ImageVersion",
            "display adapters: $($gpus -join '; ')",
            "d3d12SDKLayers.dll (D3D12 debug layer) present: $debugLayer",
            "hardware GPU available: no (GitHub-hosted runners have none; D3D12 tests use WARP)"
          )
          $lines | Tee-Object -FilePath "$env:LOG_DIR\environment.txt"
          "DEBUG_LAYER=$debugLayer" >> $env:GITHUB_ENV

      - name: Asset policy (cargo xtask policy)
        run: |
          cargo xtask policy 2>&1 | Tee-Object -FilePath "$env:LOG_DIR\policy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hardware safety policy (harness guards, workflow triggers, secrets)
        if: ${{ !cancelled() }}
        run: |
          ./tools/ci/Test-HardwareSafety.ps1 -RepoRoot $env:GITHUB_WORKSPACE 2>&1 | Tee-Object -FilePath "$env:LOG_DIR\safety.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnostic harness self-test (CPU only, Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          # The home runner uses Windows PowerShell 5.1, so test there too.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\diag\Test-VictoryDiagnostic.ps1 -RepoRoot $env:GITHUB_WORKSPACE |
            Tee-Object -FilePath "$env:LOG_DIR\harness-selftest.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\ci\Test-HardwareSafety.ps1 -RepoRoot $env:GITHUB_WORKSPACE |
            Tee-Object -FilePath "$env:LOG_DIR\safety-ps51.log"
          exit $LASTEXITCODE

      - name: PowerShell syntax check (tools/)
        if: ${{ !cancelled() }}
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem tools -Recurse -Filter *.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { "$($f.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          "PowerShell parse errors: $bad" | Tee-Object -FilePath "$env:LOG_DIR\ps-parse.log" -Append
          if ($bad -gt 0) { exit 1 }

      - name: Formatting (gate on changed files, report the rest)
        if: ${{ !cancelled() }}
        env:
          FMT_BASE: ${{ inputs.fmt_base }}
        run: |
          # The tree carries pre-existing rustfmt debt, so (per AGENTS.md) only
          # the .rs files this change touches must be clean; the rest is reported.
          #
          # Which base: on a feature branch, the merge-base with origin/FMT_BASE.
          # When HEAD is already contained in origin/FMT_BASE (a run on the
          # default branch itself, e.g. right after a merge), that diff is empty,
          # so fall back to HEAD's first parent: for a merge or squash commit that
          # covers the whole merged PR, for a direct commit only that commit. A
          # rebase-merge or a multi-commit push lands several commits at once and
          # dispatch has no "before" SHA, so pass the previous tip as fmt_base
          # to gate the whole range.
          $log = "$env:LOG_DIR\fmt.log"
          cargo fmt --all -- --check 2>&1 | Out-File -FilePath "$env:LOG_DIR\fmt-full.log" -Encoding utf8
          $ws = ([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\')
          $unformatted = @(Select-String -Path "$env:LOG_DIR\fmt-full.log" -Pattern '^Diff in (.+?\.rs):\d+:' |
            ForEach-Object {
              $p = $_.Matches[0].Groups[1].Value -replace '^\\\\\?\\', ''
              if ($p.StartsWith($ws, [StringComparison]::OrdinalIgnoreCase)) { $p = $p.Substring($ws.Length) }
              $p -replace '\\', '/'
            } | Sort-Object -Unique)

          $base = $null
          $reason = ''
          $baseRef = ''
          $resolved = $false
          if ($env:FMT_BASE -and ($env:FMT_BASE -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$')) {
            "fmt_base '$($env:FMT_BASE)' is not a branch name or SHA" | Tee-Object -FilePath $log
            exit 1
          }
          if ($env:FMT_BASE) {
            # A branch name resolves through origin/; otherwise accept a commit-ish (SHA).
            foreach ($candidate in @("origin/$env:FMT_BASE", $env:FMT_BASE)) {
              if (git rev-parse --verify --quiet "$candidate^{commit}") { $baseRef = $candidate; $resolved = $true; break }
            }
            if (-not $resolved) { $baseRef = $env:FMT_BASE }
          }
          if ($resolved) {
            $mb = (git merge-base $baseRef HEAD).Trim()
            $head = (git rev-parse HEAD).Trim()
            if ($mb -and $mb -ne $head) {
              $base = $mb
              $reason = "merge-base with $baseRef"
            } else {
              $reason = "HEAD is already in $baseRef"
            }
          } elseif ($baseRef) {
            $reason = "fmt_base '$baseRef' not found"
          } else {
            $reason = 'fmt_base empty'
          }
          if (-not $base) {
            $parent = git rev-parse --verify --quiet 'HEAD^1^{commit}'
            if ($parent) {
              $base = $parent.Trim()
              $reason += "; using HEAD's first parent"
            }
          }
          if ($base) {
            $changed = @(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.rs')
            $scope = "files changed in $base..HEAD ($reason)"
          } else {
            # Root commit or no history: every file is new, gate them all.
            $changed = @(git ls-files -- '*.rs')
            $scope = "all tracked files ($reason; no parent commit)"
          }
          $blocking = @($unformatted | Where-Object { $changed -contains $_ })
          "formatting gate base: $scope" | Tee-Object -FilePath $log
          "rust files in gate scope: $($changed.Count)" | Tee-Object -FilePath $log -Append
          "files with rustfmt differences anywhere in the tree (advisory): $($unformatted.Count)" | Tee-Object -FilePath $log -Append
          $unformatted | ForEach-Object { "  advisory: $_" } | Tee-Object -FilePath $log -Append
          "changed files needing rustfmt (blocking): $($blocking.Count)" | Tee-Object -FilePath $log -Append
          $blocking | ForEach-Object { "  blocking: $_" } | Tee-Object -FilePath $log -Append
          if ($blocking.Count -gt 0) { exit 1 }
          exit 0

      - name: Clippy (workspace, all targets)
        if: ${{ !cancelled() }}
        run: |
          # Warnings are reported, not fatal: the tree has a known pre-existing warning.
          cargo clippy --workspace --all-targets 2>&1 | Tee-Object -FilePath "$env:LOG_DIR\clippy-workspace.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clippy (victory-gpu + victory, diagnostics feature)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p victory-gpu -p victory --features diagnostics --all-targets 2>&1 | Tee-Object -FilePath "$env:LOG_DIR\clippy-diagnostics.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tests - victory-shader (WARP)
        if: ${{ !cancelled() && inputs.test_scope == 'shader-gpu' }}
        timeout-minutes: 30
        env:
          VICTORY_WARP: "1"
        run: |
          cargo test -p victory-shader 2>&1 | Tee-Object -FilePath "$env:LOG_DIR\test-victory-shader.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tests - victory-gpu, diagnostics feature (WARP, one thread)
        if: ${{ !cancelled() && inputs.test_scope == 'shader-gpu' }}
        timeout-minutes: 30
        env:
          VICTORY_D3D12_WARP: "1"
        run: |
          cargo test -p victory-gpu --features diagnostics -- --test-threads=1 2>&1 | Tee-Object -FilePath "$env:LOG_DIR\test-victory-gpu.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tests - workspace (WARP)
        if: ${{ !cancelled() && inputs.test_scope == 'workspace' }}
        timeout-minutes: 45
        env:
          VICTORY_WARP: "1"
          VICTORY_D3D12_WARP: "1"
        run: |
          # One test thread: victory-gpu's shadow/reclaim tests share
          # process-wide state and race in parallel (as the shader-gpu scope and
          # progress.md already run them). --no-fail-fast: every crate reports.
          cargo test --workspace --no-fail-fast -- --test-threads=1 2>&1 | Tee-Object -FilePath "$env:LOG_DIR\test-workspace.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build diagnostic executable
        if: ${{ !cancelled() && inputs.build_diag }}
        run: |
          cargo build --profile diag -p victory --features diagnostics 2>&1 | Tee-Object -FilePath "$env:LOG_DIR\build-diag.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item target\diag\victory.exe
          "victory.exe: $($exe.Length) bytes, SHA256 $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)" | Tee-Object -FilePath "$env:LOG_DIR\build-diag.log" -Append

      - name: Summarize
        if: ${{ always() }}
        run: |
          $s = New-Object System.Collections.Generic.List[string]
          $s.Add("## Windows CI - $env:GITHUB_SHA")
          $s.Add("")
          $s.Add("| Log | Result lines |")
          $s.Add("|---|---|")
          foreach ($f in Get-ChildItem $env:LOG_DIR -Filter *.log -ErrorAction SilentlyContinue | Sort-Object Name) {
            $hits = @(Select-String -LiteralPath $f.FullName -Pattern '^test result:|asset policy:|hardware safety check:|diagnostic harness self-test:|PowerShell parse errors:|changed files needing rustfmt|^warning: .* generated \d+ warning|^error(\[|:)|victory\.exe:' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -First 12)
            $s.Add("| ``$($f.Name)`` | $(($hits | ForEach-Object { $_ -replace '\|','/' }) -join '<br>') |")
          }
          $s.Add("")
          $s.Add("### Limitations")
          $s.Add("- GitHub-hosted ``windows-latest`` has **no hardware GPU**. D3D12 tests ran on **WARP** (software); results do not cover RTX 3070 driver behaviour, timing, VRAM or TDR.")
          $s.Add("- D3D12 debug layer (d3d12SDKLayers.dll) present on this image: **$env:DEBUG_LAYER**. This workflow does not set ``VICTORY_D3D12_DEBUG``, so debug-layer validation did not run.")
          $s.Add("- Tests that need real title files or external reference data skip themselves (environment variables unset).")
          $s.Add("- No title or game executable was launched or downloaded.")
          $s -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $s -join "`n" | Out-File -FilePath "$env:LOG_DIR\summary.md" -Encoding utf8

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ci-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload diagnostic executable
        if: ${{ success() && inputs.build_diag && inputs.upload_diag_exe }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: victory-diag-exe-${{ github.sha }}
          path: target/diag/victory.exe
          retention-days: 3
          if-no-files-found: error
